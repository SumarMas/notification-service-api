spring:
  application:
    name: notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:9036/notification_service}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root_psw}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true
    defer-datasource-initialization: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:sumar.mas.utn@gmail.com}
    password: ${MAIL_PASSWORD:irlt dubq hwqu esic}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
    baggage:
      remote-fields:
        - X-Request-Id
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_SERVER:http://localhost:9001/api/v2/spans}

logging:
  level:
    root: INFO
    org.springframework:
      security: INFO
      mail: DEBUG
    org.hibernate.SQL: DEBUG   # si quer?s ver queries SQL

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:9061/eureka/}

pool:
  user:
    url: ${USER_SERVICE_URL:http://localhost:9080/users}
  campaign:
    url: ${CAMPAIGN_SERVICE_URL:http://localhost:9080/campaigns}

queues:
  user-created:
    exchange: ${EXCHANGE_USER_CREATED:user.created}
    queue: ${QUEUE_USER_CREATED:notification.user.created.queue}
  ngo-status:
    exchange: ${EXCHANGE_NGO_STATUS:ngo.status}
    queue: ${QUEUE_NGO_STATUS:notification.ngo.status.queue}
  donation:
    exchange: ${EXCHANGE_DONATION_STATUS:donation.status}
    queue: ${QUEUE_DONATION_STATUS:notification.donation.status.queue}